name: AWS Terraform Destroy

on:
  workflow_dispatch:
    inputs:
      aws_region:
        description: "AWS region used for the infrastructure"
        required: true
        default: "us-east-1"
        type: string
      state_bucket:
        description: "S3 bucket used for Terraform state during apply"
        required: true
        type: string
      project_name:
        description: "Project name used during apply"
        required: true
        default: "sudoku"
        type: string
      wait_seconds:
        description: "Seconds to wait before destroying (0 destroys immediately)"
        required: false
        default: "0"
        type: string
  workflow_call:
    inputs:
      aws_region:
        required: true
        type: string
      state_bucket:
        required: true
        type: string
      project_name:
        required: true
        type: string
      wait_seconds:
        required: false
        default: 0
        type: number
    secrets:
      AWS_ROLE_TO_ASSUME:
        required: true
      ADMIN_SSH_PUBLIC_KEY:
        required: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: aws-terraform-${{ inputs.project_name }}
  cancel-in-progress: false

env:
  AWS_REGION: ${{ inputs.aws_region }}
  TF_STATE_BUCKET: ${{ inputs.state_bucket }}
  PROJECT_NAME: ${{ inputs.project_name }}
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_VAR_aws_region: ${{ inputs.aws_region }}
  TF_VAR_project_name: ${{ inputs.project_name }}
  TF_VAR_admin_ssh_public_key: ${{ secrets.ADMIN_SSH_PUBLIC_KEY }}
  WAIT_SECONDS: ${{ inputs.wait_seconds }}

jobs:
  destroy:
    name: Destroy AWS Terraform infrastructure
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/aws

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ inputs.aws_region }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5

      - name: Prepare Terraform state bucket
        run: bash ./prepare-state-bucket.sh

      - name: Initialize Terraform
        run: |
          terraform init -input=false \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=$PROJECT_NAME/aws/terraform.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Validate Terraform
        run: terraform validate

      - name: Verify Terraform state exists
        run: aws s3api head-object --bucket "$TF_STATE_BUCKET" --key "$PROJECT_NAME/aws/terraform.tfstate" >/dev/null

      - name: Wait before destroy
        run: |
          case "$WAIT_SECONDS" in
            ''|*[!0-9]*)
              echo "wait_seconds must be a non-negative integer."
              exit 1
              ;;
          esac

          if [ "$WAIT_SECONDS" -gt 0 ]; then
            echo "Waiting $WAIT_SECONDS seconds before destroy."
            sleep "$WAIT_SECONDS"
          fi

      - name: Destroy Terraform infrastructure
        run: terraform destroy -input=false -auto-approve
