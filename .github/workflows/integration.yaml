name: Integration Tests

on:
  workflow_dispatch:
    inputs:
      deploy_terraform:
        description: "Deploy Azure infrastructure after integration tests"
        required: true
        default: false
        type: boolean
      location:
        description: "Azure region for all infrastructure"
        required: true
        default: "East US"
        type: choice
        options:
          - East US
          - East US 2
          - West US 2
          - West Europe
          - North Europe
          - UAE North
          - Sweden Central
      vm_size:
        description: "VM size for both scale sets"
        required: true
        default: "Standard_B1s"
        type: choice
        options:
          - Standard_B1s
          - Standard_B1ms
          - Standard_B2s
          - Standard_B2ats_v2
          - Standard_B2als_v2
          - Standard_D2s_v3
          - Standard_D2als_v7
      project_name:
        description: "Project name used in Azure resource names"
        required: true
        default: "sudoku"
        type: string
      admin_username:
        description: "Linux administrator username"
        required: true
        default: "azureuser"
        type: string
      redis_port:
        description: "Managed Redis port"
        required: true
        default: "10000"
        type: string
      frontend_instance_count:
        description: "Number of frontend VM instances"
        required: true
        default: "1"
        type: string
      backend_instance_count:
        description: "Number of backend VM instances"
        required: true
        default: "1"
        type: string
      frontend_image:
        description: "Frontend container image"
        required: true
        default: "ghcr.io/hasan92mari/sudoku-frontend:latest"
        type: string
      backend_image:
        description: "Backend container image"
        required: true
        default: "ghcr.io/hasan92mari/sudoku-backend:latest"
        type: string

jobs:

  integration-test:
    name: Full Stack Integration Test
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Start full stack with Docker Compose
        run: |
          docker compose up --build -d

      - name: Wait for backend
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://localhost:5001/health; then
              echo "Backend is ready."
              exit 0
            fi

            echo "Waiting for backend..."
            sleep 2
          done

          echo "Backend did not become ready."
          docker compose ps
          docker compose logs backend
          exit 1

      - name: Wait for frontend
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://localhost/health; then
              echo "Frontend is ready."
              exit 0
            fi

            echo "Waiting for frontend..."
            sleep 2
          done

          echo "Frontend did not become ready."
          docker compose ps
          docker compose logs frontend
          exit 1

      - name: Test backend health and readiness
        run: |
          curl --fail-with-body http://localhost:5001/health
          echo
          curl --fail-with-body http://localhost:5001/ready

      - name: Test frontend health and readiness
        run: |
          curl --fail-with-body http://localhost/health
          echo
          curl --fail-with-body http://localhost/ready

      - name: Test frontend → backend session API
        run: |
          RESPONSE=$(curl --fail-with-body \
            -X POST \
            http://localhost:5001/api/session/enter \
            -H 'Content-Type: application/json' \
            -d '{"playerName":"integration-test","language":"en","theme":"dark"}')

          echo "$RESPONSE"

          echo "$RESPONSE" | jq -e '
            .success == true and
            .playerName == "integration-test"
          ' > /dev/null

      - name: Collect diagnostics
        if: always()
        run: |
          {
            echo "======================================"
            echo "Docker Compose Services"
            echo "======================================"
            docker compose ps

            echo
            echo "======================================"
            echo "Backend logs"
            echo "======================================"
            docker compose logs backend

            echo
            echo "======================================"
            echo "Frontend logs"
            echo "======================================"
            docker compose logs frontend
          } > integration-test-logs.log

      - name: Upload integration test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-${{ github.run_id }}
          path: integration-test-logs.log
          retention-days: 14

      - name: Cleanup
        if: always()
        run: |
          docker compose down -v

  terraform-apply:
    name: Deploy Azure infrastructure
    needs: integration-test
    if: inputs.deploy_terraform == true
    uses: ./.github/workflows/terraform-vm-apply.yaml
    with:
      location: ${{ inputs.location }}
      project_name: ${{ inputs.project_name }}
      admin_username: ${{ inputs.admin_username }}
      redis_port: ${{ inputs.redis_port }}
      vm_size: ${{ inputs.vm_size }}
      frontend_instance_count: ${{ inputs.frontend_instance_count }}
      backend_instance_count: ${{ inputs.backend_instance_count }}
      frontend_image: ${{ inputs.frontend_image }}
      backend_image: ${{ inputs.backend_image }}
    secrets: inherit

