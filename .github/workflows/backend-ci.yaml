name: Backend CI

on:
  workflow_dispatch:
    inputs:
      push:
        description: "Push Docker image to GHCR"
        required: true
        default: false
        type: boolean

  push:
    branches:
      - main
      - 'feat/**'
    paths:
      - 'backend/**'

  pull_request:
    branches:
      - main
    paths:
      - 'backend/**'

# ============================================================
# Workflow Environment
# ============================================================

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/sudoku-backend

jobs:

  # ============================================================
  # Backend Validation
  # ============================================================

  code-validation:
    name: Code Validation
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit Node.js dependencies
        run: npm audit --audit-level=high

      - name: Validate runtime syntax
        run: node --check index.js

  # ============================================================
  # Backend Static Security Analysis
  # ============================================================

  code-sast:
    name: Code SAST
    runs-on: ubuntu-latest

    permissions:
      security-events: write
      contents: read

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3

  # ============================================================
  # Trivy Configuration Scan
  # ============================================================

  trivy-image-config-scan:
    name: Trivy Image Config Scan
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Scan backend configuration with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: ./backend
          severity: CRITICAL,HIGH
          exit-code: '1'
          format: table
          output: trivy-config-report.txt

      - name: Upload Trivy config report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-trivy-config-${{ github.run_id }}
          path: trivy-config-report.txt
          retention-days: 14

  # ============================================================
  # Image Docker Build - AMD64
  # ============================================================

  image-build-amd64:
    name: Image Build AMD64
    runs-on: ubuntu-latest

    needs:
      - code-validation
      - code-sast
      - trivy-image-config-scan

    permissions:
      contents: read

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build AMD64 image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64
          load: true
          tags: |
            sudoku-backend:smoke
          cache-from: |
            type=gha,scope=sudoku-backend
          cache-to: |
            type=gha,mode=max,scope=sudoku-backend

      - name: Save Docker image
        run: |
          docker save \
            sudoku-backend:smoke \
            -o /tmp/sudoku-backend.tar

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-image-${{ github.run_id }}
          path: /tmp/sudoku-backend.tar
          retention-days: 1

  # ============================================================
  # Backend Smoke Test
  # ============================================================

  image-smoke-test:
    name: Image Smoke Test
    runs-on: ubuntu-latest

    needs: image-build-amd64

    permissions:
      contents: read

    steps:

      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: backend-image-${{ github.run_id }}
          path: /tmp/backend-image

      - name: Load Docker image
        run: |
          docker load \
            --input /tmp/backend-image/sudoku-backend.tar

      - name: Start backend container
        run: |
          docker run -d \
            --name sudoku-backend \
            -p 5000:5000 \
            sudoku-backend:smoke

      - name: Smoke test backend
        run: |
          echo "Waiting for application..."
          sleep 3

          curl --fail \
            --retry 5 \
            --retry-delay 1 \
            http://localhost:5000/health

      - name: Collect smoke test result
        if: always()
        run: |
          {
            echo "Backend Smoke Test"
            echo "=================="
            echo ""
            echo "Health endpoint:"
            curl -sS http://localhost:5000/health || true
            echo ""
            echo ""
            echo "Container status:"
            docker ps -a --filter name=sudoku-backend
            echo ""
            echo "Container inspect:"
            docker inspect sudoku-backend \
              --format '{{.State.Status}} - ExitCode={{.State.ExitCode}}' \
              2>/dev/null || true
          } > backend-smoke-test.log

      - name: Collect Docker logs
        if: always()
        run: |
          docker logs sudoku-backend \
            > backend-docker.log 2>&1 || true

      - name: Upload smoke test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-smoke-test-${{ github.run_id }}
          path: |
            backend-smoke-test.log
            backend-docker.log
          retention-days: 14

      - name: Cleanup container
        if: always()
        run: |
          docker rm -f sudoku-backend || true

  # ============================================================
  # Backend Container Image Security Scan
  # ============================================================

  image-trivy-vulnerability-scan:
    name: Image Trivy Vulnerability Scan
    runs-on: ubuntu-latest

    needs: image-build-amd64

    permissions:
      contents: read

    steps:

      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-image-${{ github.run_id }}
          path: /tmp/backend-image

      - name: Load Docker image
        run: |
          docker load \
            --input /tmp/backend-image/sudoku-backend.tar

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: sudoku-backend:smoke
          format: table
          output: trivy-image-report.txt
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Upload Trivy image report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-trivy-image-${{ github.run_id }}
          path: trivy-image-report.txt
          retention-days: 14

  # ============================================================
  # Backend DAST - OWASP ZAP
  # ============================================================

  image-dast:
    name: OWASP ZAP DAST
    runs-on: ubuntu-latest

    needs:
      - image-smoke-test
      - image-trivy-vulnerability-scan

    permissions:
      contents: read

    steps:

      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-image-${{ github.run_id }}
          path: /tmp/backend-image

      - name: Load Docker image
        run: |
          docker load \
            --input /tmp/backend-image/sudoku-backend.tar

      - name: Start backend container
        run: |
          docker run -d \
            --name sudoku-backend \
            -p 5000:5000 \
            sudoku-backend:smoke

      - name: Wait for backend
        run: |
          echo "Waiting for backend..."

          for i in {1..15}; do
            if curl --fail --silent http://localhost:5000/health; then
              echo ""
              echo "Backend is ready."
              exit 0
            fi

            echo "Backend not ready yet..."
            docker ps -a --filter name=sudoku-backend
            sleep 2
          done

          echo ""
          echo "Backend failed to become ready."
          echo ""
          echo "Container status:"
          docker inspect sudoku-backend \
            --format '{{.State.Status}} - ExitCode={{.State.ExitCode}} - Error={{.State.Error}}'

          echo ""
          echo "Container logs:"
          docker logs sudoku-backend || true

          exit 1

      - name: Run OWASP ZAP baseline scan
        run: |
          docker run --rm \
            --network host \
            -v "$(pwd):/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t http://127.0.0.1:5000 \
            -r zap-report.html \
            -J zap-report.json \
            -I

      - name: Upload ZAP reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-zap-${{ github.run_id }}
          path: |
            zap-report.html
            zap-report.json
          retention-days: 14

      - name: Collect Docker logs
        if: always()
        run: |
          docker logs sudoku-backend \
            > backend-zap-docker.log 2>&1 || true

      - name: Cleanup container
        if: always()
        run: |
          docker rm -f sudoku-backend || true

  # ============================================================
  # Backend Image Push
  # ============================================================

  image-push:
    name: Image Push
    runs-on: ubuntu-latest

    needs:
      - image-dast

    if: |
      github.event_name == 'push' ||
      (
        github.event_name == 'workflow_dispatch' &&
        inputs.push == true
      )

    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}

    permissions:
      contents: read
      packages: write

    env:
      IMAGE_TAG: ${{ github.ref == 'refs/heads/main' && 'latest' || 'dev' }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Set image version
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "IMAGE_VERSION=${GITHUB_RUN_NUMBER}-${SHORT_SHA}" >> "$GITHUB_ENV"

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}-${{ env.IMAGE_VERSION }}
          cache-from: |
            type=gha,scope=sudoku-backend
          cache-to: |
            type=gha,mode=max,scope=sudoku-backend

      - name: Display image digest
        run: |
          echo "Environment tag:"
          echo "${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"

          echo "Version tag:"
          echo "${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}-${{ env.IMAGE_VERSION }}"

          echo "Digest:"
          echo "${{ steps.build.outputs.digest }}"
