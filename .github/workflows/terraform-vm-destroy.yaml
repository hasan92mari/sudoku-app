name: Terraform VM-Destroy

on:
  workflow_dispatch:
    inputs:
      wait_seconds:
        description: "Seconds to wait before destroying the infrastructure"
        required: false
        default: "0"
        type: string
  workflow_call:
    inputs:
      wait_seconds:
        description: "Seconds to wait before destroying the infrastructure"
        required: false
        default: 0
        type: number
    secrets:
      AZURE_CLIENT_ID:
        required: true
      AZURE_TENANT_ID:
        required: true
      AZURE_SUBSCRIPTION_ID:
        required: true
      ADMIN_SSH_PUBLIC_KEY:
        required: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-infrastructure
  cancel-in-progress: true

env:
  TF_IN_AUTOMATION: true
  TF_INPUT: false
  ARM_USE_OIDC: true
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  TF_VAR_admin_ssh_public_key: ${{ secrets.ADMIN_SSH_PUBLIC_KEY }}
  WAIT_SECONDS: ${{ inputs.wait_seconds }}

jobs:
  destroy:
    name: Destroy Terraform infrastructure
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Initialize Terraform
        run: terraform init -input=false

      - name: Validate Terraform
        run: terraform validate

      - name: Wait before destroy
        run: |
          case "$WAIT_SECONDS" in
            ''|*[!0-9]*)
              echo "wait_seconds must be a non-negative integer."
              exit 1
              ;;
          esac

          if [ "$WAIT_SECONDS" -gt 0 ]; then
            echo "Waiting $WAIT_SECONDS seconds before destroy."
            sleep "$WAIT_SECONDS"
          fi

      - name: Destroy Terraform infrastructure
        run: terraform destroy -input=false -auto-approve
