services:
  backend-redis:
    image: redis:alpine
    container_name: sudoku-backend-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]

  frontend-redis:
    image: redis:alpine
    container_name: sudoku-frontend-redis
    ports:
      - "6380:6379"
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]

  backend:
    build:
      context: ./backend
    container_name: sudoku-backend
    ports:
      - "5001:5001"
    environment:
      PORT: 5001
      REDIS_URL: redis://backend-redis:6379
      SESSION_TTL_SECONDS: 86400
    depends_on:
      - backend-redis
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: sudoku-frontend
    ports:
      - "80:80"
    environment:
      PORT: 80
      BACKEND_BASE_URL: http://backend:5001
      FRONTEND_REDIS_URL: redis://frontend-redis:6379
    depends_on:
      - backend
      - frontend-redis
    restart: unless-stopped