apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app1
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/hasan92mari/sudoku-app.git
    targetRevision: HEAD
    path: argo
  destination:
    server: https://kubernetes.default.svc
    namespace: sudoku-ns
  syncPolicy:
    automated:
      prune: true
      selfHeal: true